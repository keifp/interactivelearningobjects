<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall Deck</title>
    <style>
      :root {
        --paper: #f7f3ec;
        --surface: #fffdf9;
        --ink: #23202b;
        --muted: #5c5766;
        --hairline: #e4ddd0;
        --indigo: #3b3f8f;
        --indigo-deep: #2c2f6e;
        --coral: #e26d5c;
        --coral-deep: #c9533f;
        --success: #2e7d5b;
        --error: #b3402f;
        --disabled: #ece6db;
        --disabled-ink: #625c6c;
        --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color-scheme: light;
        font-family: var(--sans);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
      }

      :focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 3px;
      }

      .app {
        width: min(100%, 880px);
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(16px, 3vw, 36px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: clamp(14px, 2.4vw, 26px);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--hairline);
      }

      .title-block {
        display: grid;
        gap: 6px;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(1.7rem, 4.8vw, 2.6rem);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .progress {
        flex-shrink: 0;
        min-width: 88px;
        padding: 8px 16px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--surface);
        color: var(--indigo);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        letter-spacing: 0.02em;
      }

      .stage {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
        min-height: 0;
      }

      .card-shell {
        position: relative;
        perspective: 1300px;
        min-height: 0;
      }

      /* Left accent bar: indigo on the front, coral once the card is flipped */
      .card-shell::before {
        content: "";
        position: absolute;
        top: 22px;
        bottom: 22px;
        left: 0;
        width: 7px;
        border-radius: 999px;
        background: var(--indigo);
        transition: background-color 320ms ease;
        z-index: 2;
        pointer-events: none;
      }

      .card-shell.is-flipped::before {
        background: var(--coral);
      }

      .flashcard {
        position: relative;
        height: 100%;
        min-height: 0;
        transform-style: preserve-3d;
        transition: transform 560ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .flashcard.is-flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        justify-items: center;
        gap: clamp(14px, 2vw, 22px);
        padding: clamp(24px, 4.4vw, 48px);
        border: 1px solid var(--hairline);
        border-radius: 22px;
        background: var(--surface);
        backface-visibility: hidden;
        box-shadow: 0 6px 24px rgba(35, 32, 43, 0.06);
        overflow: auto;
      }

      .card-front {
        background: var(--surface);
      }

      .card-back {
        background: var(--surface);
        color: var(--ink);
        transform: rotateY(180deg);
      }

      .label {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .question,
      .answer {
        width: 100%;
        max-width: 640px;
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(1.6rem, 4.8vw, 2.7rem);
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.015em;
        text-align: center;
        overflow-wrap: anywhere;
        color: var(--ink);
      }

      .answer {
        color: var(--indigo);
      }

      .front-content,
      .back-content {
        width: 100%;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: clamp(18px, 3vw, 30px);
        min-height: 0;
      }

      .controls {
        width: min(100%, 640px);
        display: grid;
        gap: 12px;
      }

      .answer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: end;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .answer-input {
        width: 100%;
        min-height: 54px;
        padding: 13px 18px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        font-size: clamp(1.02rem, 3.4vw, 1.15rem);
        outline: none;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          background-color 160ms ease;
      }

      .answer-input::placeholder {
        color: #8a8492;
      }

      .answer-input:hover {
        border-color: #cdc4b4;
      }

      .answer-input:focus {
        border-color: var(--indigo);
        background: var(--surface);
        box-shadow: 0 0 0 4px rgba(59, 63, 143, 0.16);
      }

      .answer-input.is-correct {
        border-color: var(--success);
        box-shadow: 0 0 0 4px rgba(46, 125, 91, 0.16);
      }

      .answer-input.is-incorrect {
        border-color: var(--error);
        box-shadow: 0 0 0 4px rgba(179, 64, 47, 0.14);
      }

      .button {
        min-height: 54px;
        padding: 0 22px;
        border: 1px solid var(--coral);
        border-radius: 999px;
        background: var(--coral);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .button:hover:not(:disabled),
      .button:focus-visible:not(:disabled) {
        background: var(--coral-deep);
        border-color: var(--coral-deep);
        box-shadow: 0 6px 16px rgba(226, 109, 92, 0.28);
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: not-allowed;
        border-color: var(--hairline);
        background: var(--disabled);
        color: var(--disabled-ink);
        opacity: 1;
        box-shadow: none;
      }

      .button.secondary {
        background: var(--surface);
        border-color: var(--indigo);
        color: var(--indigo);
      }

      .button.secondary:hover:not(:disabled),
      .button.secondary:focus-visible:not(:disabled) {
        background: var(--indigo);
        border-color: var(--indigo);
        color: #ffffff;
        box-shadow: 0 6px 16px rgba(59, 63, 143, 0.22);
      }

      .button.secondary:disabled {
        border-color: var(--hairline);
        background: var(--disabled);
        color: var(--disabled-ink);
      }

      .controls.is-unlocked {
        justify-items: center;
      }

      .controls.is-unlocked .answer-row {
        width: min(100%, 240px);
        grid-template-columns: 1fr;
      }

      .controls.is-unlocked .field,
      .controls.is-unlocked #checkButton,
      .controls.is-unlocked .feedback {
        display: none;
      }

      .feedback {
        min-height: 26px;
        margin: 0;
        font-weight: 600;
        line-height: 1.4;
      }

      .feedback.correct {
        color: var(--success);
      }

      .feedback.incorrect {
        color: var(--error);
      }

      .nav {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .nav .button {
        min-width: 130px;
      }

      .completion {
        position: relative;
        min-height: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 20px;
        padding: clamp(32px, 7vw, 68px);
        border: 1px solid var(--hairline);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 6px 24px rgba(35, 32, 43, 0.06);
        text-align: center;
        overflow: hidden;
      }

      .completion::before {
        content: "";
        position: absolute;
        top: 22px;
        bottom: 22px;
        left: 0;
        width: 7px;
        border-radius: 999px;
        background: var(--coral);
      }

      .completion[hidden] {
        display: none;
      }

      .completion h2 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 600;
        color: var(--indigo);
        font-size: clamp(2.2rem, 8vw, 4.4rem);
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .completion p {
        max-width: 520px;
        margin: 0;
        color: var(--ink);
        font-size: clamp(1rem, 3vw, 1.2rem);
        line-height: 1.5;
      }

      .score-note {
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 720px) {
        .app {
          padding: 14px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .answer-row {
          grid-template-columns: 1fr;
        }

        .button {
          width: 100%;
        }

        .nav {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 430px) {
        .app {
          padding: 12px;
        }

        .card-face {
          padding: 22px 18px 18px 22px;
        }

        .card-shell::before {
          width: 5px;
        }

        .question,
        .answer {
          font-size: clamp(1.4rem, 7.5vw, 1.9rem);
        }

        .nav {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <div class="title-block">
          <h1>Recall Deck</h1>
          <p class="tagline">Write your answer, check it, then turn the card over to confirm.</p>
        </div>
        <div class="progress" id="progress">1 of 3</div>
      </header>

      <section class="stage" id="stage" aria-label="Recall deck practice">
        <div class="card-shell" id="cardShell">
          <article class="flashcard" id="flashcard">
            <div class="card-face card-front">
              <p class="label">Prompt</p>
              <div class="front-content">
                <p class="question" id="question">Which planet goes by the nickname "the Red Planet"?</p>
                <form class="controls" id="answerForm" autocomplete="off">
                  <div class="answer-row">
                    <div class="field">
                      <label for="answerInput">Your response</label>
                      <input
                        class="answer-input"
                        id="answerInput"
                        name="answer"
                        type="text"
                        inputmode="text"
                        placeholder="Write it here, then check"
                        aria-describedby="feedback"
                      />
                    </div>
                    <button class="button" type="submit" id="checkButton">Check it</button>
                    <button class="button secondary" type="button" id="flipButton" disabled>Turn over</button>
                  </div>
                  <p class="feedback" id="feedback" aria-live="polite"></p>
                </form>
              </div>
              <span aria-hidden="true"></span>
            </div>
            <div class="card-face card-back">
              <p class="label">Answer</p>
              <div class="back-content">
                <p class="answer" id="answer">Mars</p>
                <button class="button secondary" type="button" id="showQuestionButton">Back to prompt</button>
              </div>
              <span aria-hidden="true"></span>
            </div>
          </article>
        </div>

        <nav class="nav" aria-label="Move between cards">
          <button class="button secondary" type="button" id="previousButton">Back</button>
          <button class="button secondary" type="button" id="nextButton">Forward</button>
        </nav>
      </section>

      <section class="completion" id="completion" hidden>
        <p class="label">All done</p>
        <h2>Deck cleared</h2>
        <p>Every card in the deck has been answered correctly.</p>
        <p class="score-note" id="scoreNote"></p>
        <button class="button secondary" type="button" id="retryButton">Start over</button>
      </section>
    </main>

    <script>
      const cards = [
        {
          front: 'Which planet goes by the nickname "the Red Planet"?',
          back: "Mars",
          accepted: ["mars"],
        },
        {
          front: "Which ocean is the biggest one on Earth?",
          back: "Pacific Ocean",
          accepted: ["pacific ocean", "the pacific ocean", "pacific"],
        },
        {
          front: "How many continents does the world have?",
          back: "7",
          accepted: ["7", "seven"],
        },
      ];

      const state = {
        current: 0,
        solved: Array(cards.length).fill(false),
        responses: Array(cards.length).fill(""),
        messages: Array(cards.length).fill(""),
        messageTypes: Array(cards.length).fill(""),
        flipped: Array(cards.length).fill(false),
        firstAttemptResults: Array(cards.length).fill(null),
      };

      const scorm = {
        api: null,
        initialized: false,
        finished: false,
      };

      const stage = document.querySelector("#stage");
      const completion = document.querySelector("#completion");
      const cardShell = document.querySelector("#cardShell");
      const flashcard = document.querySelector("#flashcard");
      const question = document.querySelector("#question");
      const answer = document.querySelector("#answer");
      const answerForm = document.querySelector("#answerForm");
      const answerInput = document.querySelector("#answerInput");
      const feedback = document.querySelector("#feedback");
      const progress = document.querySelector("#progress");
      const checkButton = document.querySelector("#checkButton");
      const flipButton = document.querySelector("#flipButton");
      const showQuestionButton = document.querySelector("#showQuestionButton");
      const previousButton = document.querySelector("#previousButton");
      const nextButton = document.querySelector("#nextButton");
      const retryButton = document.querySelector("#retryButton");
      const scoreNote = document.querySelector("#scoreNote");

      function setFlipped(flipped) {
        flashcard.classList.toggle("is-flipped", flipped);
        cardShell.classList.toggle("is-flipped", flipped);
      }

      function normalize(value) {
        return value.trim().toLowerCase().replace(/\s+/g, " ");
      }

      function isCorrectAnswer(value) {
        return cards[state.current].accepted.includes(normalize(value));
      }

      function findScormApi(win) {
        let currentWindow = win;
        let attempts = 0;

        while (currentWindow && attempts < 500) {
          try {
            if (currentWindow.API) {
              return currentWindow.API;
            }

            if (currentWindow.parent === currentWindow) {
              break;
            }

            currentWindow = currentWindow.parent;
          } catch {
            break;
          }
          attempts += 1;
        }

        return null;
      }

      function callScorm(method, ...args) {
        if (!scorm.api || typeof scorm.api[method] !== "function") {
          return null;
        }

        try {
          return scorm.api[method](...args);
        } catch {
          return null;
        }
      }

      function setScormValue(element, value) {
        callScorm("LMSSetValue", element, value);
      }

      function commitScorm() {
        callScorm("LMSCommit", "");
      }

      function calculateScore() {
        const correctFirstAttempts = state.firstAttemptResults.filter((result) => result === true).length;
        return Math.round((correctFirstAttempts / cards.length) * 100);
      }

      function updateScormProgress() {
        if (!scorm.initialized) {
          return;
        }

        const score = calculateScore();
        const perfect = allCardsSolved() && score === 100;
        setScormValue("cmi.core.score.min", "0");
        setScormValue("cmi.core.score.max", "100");
        setScormValue("cmi.core.score.raw", String(score));
        setScormValue("cmi.core.lesson_status", perfect ? "completed" : "incomplete");
        commitScorm();
      }

      function initializeScorm() {
        scorm.api = findScormApi(window) || (window.opener ? findScormApi(window.opener) : null);

        if (!scorm.api) {
          return;
        }

        const initialized = callScorm("LMSInitialize", "") === "true";
        scorm.initialized = initialized;

        if (initialized) {
          updateScormProgress();
        }
      }

      function finishScorm() {
        if (!scorm.initialized || scorm.finished) {
          return;
        }

        updateScormProgress();
        callScorm("LMSFinish", "");
        scorm.finished = true;
      }

      function recordFirstAttempt(isCorrect) {
        if (state.firstAttemptResults[state.current] === null) {
          state.firstAttemptResults[state.current] = isCorrect;
        }
      }

      function setFeedback(message, type) {
        feedback.textContent = message;
        feedback.className = type ? `feedback ${type}` : "feedback";
        answerInput.classList.toggle("is-correct", type === "correct");
        answerInput.classList.toggle("is-incorrect", type === "incorrect");
      }

      function saveFeedback(message, type) {
        state.messages[state.current] = message;
        state.messageTypes[state.current] = type;
        setFeedback(message, type);
      }

      function allCardsSolved() {
        return state.solved.every(Boolean);
      }

      function showCompletion() {
        stage.hidden = true;
        completion.hidden = false;
        progress.textContent = "Done";

        const score = calculateScore();
        scoreNote.textContent =
          score === 100
            ? "Your score is 100%, and the activity has been recorded as complete."
            : `Your score is ${score}%. The activity stays marked incomplete because not every first try was correct.`;
        updateScormProgress();
      }

      function clearCheckState() {
        state.solved[state.current] = false;
        state.responses[state.current] = answerInput.value;
        state.flipped[state.current] = false;
        answerForm.classList.remove("is-unlocked");
        flipButton.disabled = true;
        setFlipped(false);
        saveFeedback("", "");
      }

      function unlockCurrentCard() {
        state.solved[state.current] = true;
        state.responses[state.current] = answerInput.value;
        state.flipped[state.current] = false;
        answerForm.classList.add("is-unlocked");
        flipButton.disabled = false;
        saveFeedback("", "");

        if (allCardsSolved()) {
          showCompletion();
        } else {
          updateScormProgress();
        }
      }

      function lockFlipWithError() {
        state.solved[state.current] = false;
        state.responses[state.current] = answerInput.value;
        state.flipped[state.current] = false;
        answerForm.classList.remove("is-unlocked");
        flipButton.disabled = true;
        setFlipped(false);
        saveFeedback("Not quite. Revise your response to turn the card over.", "incorrect");
        updateScormProgress();
      }

      function evaluateAnswer({ showEmpty = false } = {}) {
        const value = answerInput.value;

        if (!normalize(value)) {
          if (showEmpty) {
            recordFirstAttempt(false);
            saveFeedback("Write a response before checking.", "incorrect");
          } else {
            saveFeedback("", "");
          }
          state.solved[state.current] = false;
          state.responses[state.current] = "";
          state.flipped[state.current] = false;
          answerForm.classList.remove("is-unlocked");
          flipButton.disabled = true;
          setFlipped(false);
          updateScormProgress();
          return false;
        }

        if (isCorrectAnswer(value)) {
          recordFirstAttempt(true);
          unlockCurrentCard();
          return true;
        }

        recordFirstAttempt(false);
        lockFlipWithError();
        return false;
      }

      function renderCard() {
        const card = cards[state.current];
        const solved = state.solved[state.current];
        question.textContent = card.front;
        answer.textContent = card.back;
        progress.textContent = `${state.current + 1} of ${cards.length}`;
        answerInput.value = state.responses[state.current];
        answerForm.classList.toggle("is-unlocked", solved);
        setFlipped(solved && state.flipped[state.current]);
        flipButton.disabled = !solved;
        previousButton.disabled = state.current === 0;
        nextButton.disabled = state.current === cards.length - 1;
        setFeedback(state.messages[state.current], state.messageTypes[state.current]);

        if (!solved) {
          requestAnimationFrame(() => answerInput.focus({ preventScroll: true }));
        }
      }

      function resetPractice() {
        state.current = 0;
        state.solved.fill(false);
        state.responses.fill("");
        state.messages.fill("");
        state.messageTypes.fill("");
        state.flipped.fill(false);
        state.firstAttemptResults.fill(null);
        completion.hidden = true;
        stage.hidden = false;
        updateScormProgress();
        renderCard();
      }

      answerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        evaluateAnswer({ showEmpty: true });
      });

      answerInput.addEventListener("input", () => {
        clearCheckState();
      });

      flipButton.addEventListener("click", () => {
        if (!state.solved[state.current]) {
          lockFlipWithError();
          return;
        }
        state.flipped[state.current] = !state.flipped[state.current];
        setFlipped(state.flipped[state.current]);
      });

      showQuestionButton.addEventListener("click", () => {
        state.flipped[state.current] = false;
        setFlipped(false);
      });

      previousButton.addEventListener("click", () => {
        state.current = Math.max(0, state.current - 1);
        renderCard();
      });

      nextButton.addEventListener("click", () => {
        state.current = Math.min(cards.length - 1, state.current + 1);
        renderCard();
      });

      retryButton.addEventListener("click", () => {
        resetPractice();
      });

      window.addEventListener("beforeunload", () => {
        finishScorm();
      });

      initializeScorm();
      renderCard();
    </script>
  </body>
</html>
