<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Health Aide Stories</title>
<style>
  :root{
    --bg:#1d1d1f;          /* page background */
    --card:#2a2a2d;        /* card backdrop behind photos */
    --ink:#ffffff;
    --muted:#c9c9cc;
    --accent:#0f7a6c;
    --accent-dark:#0e2e2a;
    --tint:rgba(29,29,31,.55);
    --font:"Aptos","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{padding:0 0 3rem}

  .intro{max-width:1100px;margin:0 auto;padding:2.5rem 1.25rem 1.5rem}
  .intro h1{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:700;margin:0 0 .5rem;letter-spacing:-.01em}
  .intro p{color:var(--muted);max-width:60ch;margin:0;font-size:1.02rem;line-height:1.5}
  .intro .hint{margin-top:.6rem;font-size:.9rem;color:#9a9a9f}

  /* ---------- grid ---------- */
  .grid{max-width:1100px;margin:0 auto;padding:0 1.25rem;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-left:6px solid var(--accent)}
  @media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.grid{grid-template-columns:1fr;border-left-width:4px}}

  .card{position:relative;overflow:hidden;background:var(--card);aspect-ratio:10/9;border:0;padding:0;margin:0;cursor:pointer;text-align:left;color:inherit;font:inherit;outline-offset:-4px}
  .card:focus-visible{outline:3px solid #fff}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(.95);transform:scale(1);transition:filter .45s ease,transform .6s ease}
  .card::after{content:"";position:absolute;inset:0;background:var(--tint);transition:background .45s ease}
  .card .name{position:absolute;left:1.1rem;bottom:1rem;z-index:2;font-size:clamp(1.05rem,1.6vw,1.35rem);font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity .3s ease,transform .3s ease}

  /* reveal panel */
  .panel{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:1rem 1.1rem 1.1rem;
    background:linear-gradient(180deg,rgba(18,49,43,0) 0%,rgba(18,49,43,.88) 28%,rgba(18,49,43,.97) 100%);
    transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.7,.2,1)}
  .panel h3{margin:0 0 .15rem;font-size:1.2rem;font-weight:700}
  .panel .role{margin:0;font-size:.95rem;font-weight:600;color:#e6f2f0}
  .panel .meta{margin:.1rem 0 .7rem;font-size:.88rem;color:#cfe3e0;line-height:1.35}
  .panel .meta span+span::before{content:"·";margin:0 .4em;color:#8cbfb8}
  .panel .more{display:inline-flex;align-items:center;gap:.4rem;background:#fff;color:var(--accent-dark);font-weight:700;font-size:.9rem;padding:.5rem .9rem;border-radius:999px;border:0;font-family:inherit}
  .panel .more svg{width:.9em;height:.9em}

  .card.is-open img,.card:hover img,.card:focus-visible img{filter:grayscale(0) contrast(1);transform:scale(1.05)}
  .card.is-open::after,.card:hover::after,.card:focus-visible::after{background:rgba(29,29,31,.05)}
  .card.is-open .panel,.card:hover .panel,.card:focus-visible .panel{transform:translateY(0)}
  .card.is-open .name,.card:hover .name,.card:focus-visible .name{opacity:0;transform:translateY(6px)}

  @media (hover:none){
    /* touch: hover styles don't stick, so rely on .is-open only */
    .card:hover img{filter:grayscale(1) contrast(.95);transform:none}
    .card:hover::after{background:var(--tint)}
    .card:hover .panel{transform:translateY(100%)}
    .card:hover .name{opacity:1;transform:none}
    .card.is-open img{filter:none;transform:scale(1.05)}
    .card.is-open::after{background:rgba(29,29,31,.05)}
    .card.is-open .panel{transform:translateY(0)}
    .card.is-open .name{opacity:0}
  }

  /* ---------- modal ---------- */
  .modal[hidden]{display:none}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
  .dialog{position:relative;width:min(960px,100%);max-height:92vh;overflow:auto;background:#fff;color:#1d1d1f;border-radius:14px;display:grid;grid-template-columns:minmax(240px,38%) 1fr;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  @media (max-width:720px){.dialog{grid-template-columns:1fr}}
  .dialog .photo{position:relative;min-height:280px;background:#333}
  .dialog .photo img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .dialog .body{padding:2rem 2.2rem 2.2rem}
  .dialog .kicker{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 .5rem}
  .dialog h2{margin:0 0 .25rem;font-size:1.8rem;letter-spacing:-.01em;line-height:1.15}
  .dialog .role{margin:0;font-weight:600;color:#3a3a3e}
  .dialog .meta{margin:.25rem 0 1.2rem;color:#6b6b70;font-size:.95rem}
  .dialog .meta span+span::before{content:"·";margin:0 .4em}
  .dialog blockquote{margin:0 0 1.2rem;padding:.2rem 0 .2rem 1rem;border-left:4px solid var(--accent);font-size:1.15rem;line-height:1.45;color:#232326;font-style:italic}
  .dialog .story p{margin:0 0 .9rem;line-height:1.6;font-size:1rem;color:#2c2c30}
  .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
  .tags span{background:#eef4f3;color:var(--accent-dark);border:1px solid #cfe3e0;border-radius:999px;padding:.25rem .7rem;font-size:.8rem;font-weight:600}
  .close{position:absolute;top:.6rem;right:.6rem;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1d1d1f;font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .close:focus-visible{outline:3px solid var(--accent)}
  .nav{display:flex;gap:.5rem;margin-top:1.6rem}
  .nav button{border:1.5px solid #d6d6da;background:#fff;color:#1d1d1f;padding:.5rem .9rem;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent-dark)}
  body.modal-open{overflow:hidden}

  @media (prefers-reduced-motion:reduce){.card img,.card::after,.panel,.card .name{transition:none}}
</style>
</head>
<body>

<header class="intro">
  <h1>Meet the Aides</h1>
  <p>Six home health aides, personal care aides, and nursing assistants share what the work is really like — the parts that are hard, and the parts that keep them coming back.</p>
  <p class="hint">Hover over (or tap) a photo to see who they are, then choose <strong>More</strong> to read their story.</p>
</header>

<section class="grid" id="grid" aria-label="Aide profiles"></section>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-name">
  <div class="dialog">
    <button class="close" id="m-close" aria-label="Close story">&times;</button>
    <div class="photo"><img id="m-img" alt=""></div>
    <div class="body">
      <p class="kicker">Worker story</p>
      <h2 id="m-name"></h2>
      <p class="role" id="m-role"></p>
      <p class="meta" id="m-meta"></p>
      <blockquote id="m-quote"></blockquote>
      <div class="story" id="m-story"></div>
      <div class="tags" id="m-tags"></div>
      <div class="nav">
        <button id="m-prev" type="button">&larr; Previous</button>
        <button id="m-next" type="button">Next &rarr;</button>
      </div>
    </div>
  </div>
</div>

    role:"Home Health Aide & CNA", org:"Crossroads Home Health", town:"Fairhaven", years:12,
    quote:"Families think the job is the tasks. The job is noticing what changed since Tuesday.",
    story:[
      "Adaeze trained as a nursing assistant in a long-term-care facility and moved to home care after her second child was born, because the schedule let her be home for school pickup. Twelve years later she is the aide her agency assigns to its most complex cases — clients with dementia, clients on hospice, families in conflict about a parent's care.",
      "She keeps a small notebook in her car and writes three lines after every visit: what she saw, what she did, what she's watching for next time. Two of her observations — a new swelling, a change in how a client sat up — led to same-day nurse visits that caught problems early.",
      "Adaeze now precepts new aides for the agency and is blunt about what she tells them: document like someone else will read it, because someone will."
    ],

    quote:"I was scared of the wrong things. Not the lifting — the silence in a house where nobody talks anymore.",
    story:[
      "Mei-Lin took a personal care aide job the summer after high school as a stopgap. She stayed. She now supports four clients across two towns, mostly women in their eighties who want to remain in the homes they raised their families in.",
      "The hardest part of her first year was walking into houses where a client hadn't spoken to anyone in days. She learned to narrate what she was doing, to ask about the photographs on the wall, to bring the mail in and read the return addresses out loud — small habits that turned visits into conversations.",
      "She is taking prerequisite courses toward an LNA license and wants to stay with the same clients through that transition."

    quote:"Winter is a whole second job. Half of my visit is getting up the driveway.",
    story:[
      "Kalani moved across the country to be near her sister and took a home health aide job because it was the fastest path to a paycheck that mattered. Six years in, she covers some of the most spread-out territory her agency has — clients on dirt roads that turn to ice from December to March.",
      "She has become the person the office calls when a schedule falls apart: she knows which clients can flex, which cannot, and which need a phone call rather than a visit on a storm day. Her supervisor calls it dispatching; Kalani calls it knowing people.",
      "She is a member of her agency's safety committee and helped write its winter-driving and no-show protocols."

    quote:"I've helped people die well. That's not sad. That's the job done right.",
    story:[
      "Roz has been a nursing assistant for 22 years — first in a hospital, then in a nursing home, and for the last 14 in home health and hospice. She has cared for people through their final weeks in farmhouses, apartments, and once in a camper parked beside a son's house because that was where the client wanted to be.",
      "She is matter-of-fact about the emotional side of the work. Grief is part of it; so is the satisfaction of a family that felt supported. What she will not accept is being treated as interchangeable — she has left two agencies over scheduling practices that ignored continuity of care.",
      "Roz sits on a state workforce advisory group and speaks to trainees about what a sustainable career in direct care looks like."

    role:"Home Health Aide & Hospice Aide", org:"Riverside Home Care", town:"Elmridge", years:8,
    quote:"Being the only man on the team used to bother me. Now I'm the one clients ask for when they need a lift.",
    story:[
      "Mateo started as a hospital transport aide and moved into home care when a client's family asked, at discharge, whether he could keep helping at home. He has been a home health and hospice aide for eight years and is one of only two men on his agency's field staff.",
      "He is candid about what that has meant: clients who assumed he was the nurse, families who weren't sure a man should help with bathing, and — more often — clients who were relieved to have someone strong enough for safe transfers and comfortable enough to talk about anything.",
      "Mateo is a certified trainer in safe patient handling and now teaches the transfer and mobility labs in his agency's onboarding program."
    ],
    tags:["Diversity and Equity","Safe patient handling","Training"]
  }
];

const grid = document.getElementById('grid');
const touch = window.matchMedia('(hover: none)').matches;

PEOPLE.forEach((p, i) => {
  const card = document.createElement('button');
  card.className = 'card';
  card.type = 'button';
  card.dataset.index = i;
  card.setAttribute('aria-label', `${p.name}, ${p.role}, ${p.town}. Open story.`);
  card.innerHTML = `
    <img src="${p.img}" alt="">
    <span class="name">${p.name}</span>
    <div class="panel" aria-hidden="true">
      <h3>${p.name}</h3>
      <p class="role">${p.role}</p>
      <p class="meta"><span>${p.org}</span><span>${p.town}</span><span>${p.years} years</span></p>
      <span class="more">More
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>`;
  card.addEventListener('click', () => {
    if (touch && !card.classList.contains('is-open')) {
      // first tap reveals, second tap opens
      document.querySelectorAll('.card.is-open').forEach(c => c.classList.remove('is-open'));
      card.classList.add('is-open');
      return;
    }
    openModal(i);
  });
  grid.appendChild(card);
});

/* ---- modal ---- */
const modal = document.getElementById('modal');
const el = id => document.getElementById(id);
let current = 0, lastFocus = null;

function render(i) {
  const p = PEOPLE[i];
  current = i;
  el('m-img').src = p.img;
  el('m-img').alt = `Portrait of ${p.name}`;
  el('m-name').textContent = p.name;
  el('m-role').textContent = p.role;
  el('m-meta').innerHTML = `<span>${p.org}</span><span>${p.town}</span><span>${p.years} years in direct care</span>`;
  el('m-quote').textContent = `“${p.quote}”`;
  el('m-story').innerHTML = p.story.map(s => `<p>${s}</p>`).join('');
  el('m-tags').innerHTML = p.tags.map(t => `<span>${t}</span>`).join('');
  el('m-prev').disabled = i === 0;
  el('m-next').disabled = i === PEOPLE.length - 1;
}
function openModal(i) {
  lastFocus = document.activeElement;
  render(i);
  modal.hidden = false;
  document.body.classList.add('modal-open');
  el('m-close').focus();
}
function closeModal() {
  modal.hidden = true;
  document.body.classList.remove('modal-open');
  document.querySelectorAll('.card.is-open').forEach(c => c.classList.remove('is-open'));
  if (lastFocus) lastFocus.focus();
}
el('m-close').addEventListener('click', closeModal);
el('m-prev').addEventListener('click', () => render(Math.max(0, current - 1)));
el('m-next').addEventListener('click', () => render(Math.min(PEOPLE.length - 1, current + 1)));
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (modal.hidden) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight' && current < PEOPLE.length - 1) render(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) render(current - 1);
  if (e.key === 'Tab') {
    const f = [...modal.querySelectorAll('button:not([disabled])')];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
// tap outside a card on touch devices collapses the open card
document.addEventListener('click', e => {
  if (touch && !e.target.closest('.card') && modal.hidden)
    document.querySelectorAll('.card.is-open').forEach(c => c.classList.remove('is-open'));
});
</script>
