<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Octave Piano</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e8;
      --panel: #f3fdfd;
      --ink: #1e2329;
      --muted: #5e6670;
      --accent: #006d77;
      --accent-strong: #014f57;
      --white-key: #f8fefe;
      --white-key-edge: #d8d0c2;
      --black-key: #171b20;
      --black-key-edge: #050607;
      --shadow: rgba(33, 26, 14, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(0, 109, 119, 0.12), transparent 34%),
        linear-gradient(315deg, rgba(214, 131, 48, 0.14), transparent 36%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(94vw, 920px);
      padding: 32px;
      border: 1px solid rgba(30, 35, 41, 0.1);
      border-radius: 8px;
      background: rgba(243, 253, 253, 0.88);
      box-shadow: 0 24px 80px var(--shadow);
      backdrop-filter: blur(14px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .display {
      min-width: 108px;
      padding: 12px 14px;
      border: 1px solid rgba(0, 109, 119, 0.24);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      text-align: center;
    }

    .display span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .display strong {
      display: block;
      margin-top: 4px;
      color: var(--accent-strong);
      font-size: 1.8rem;
      line-height: 1;
    }

    .piano-wrap {
      overflow-x: auto;
      padding: 10px 8px 2px;
    }

    .piano {
      position: relative;
      width: min(100%, 784px);
      min-width: 620px;
      height: 320px;
      margin: 0 auto;
      border-radius: 8px;
      user-select: none;
    }

    .white-keys {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      height: 100%;
      gap: 0;
      padding: 0 1px 1px;
      border-radius: 8px;
      background: #1f252c;
      box-shadow: inset 0 -14px 18px rgba(0, 0, 0, 0.16);
    }

    .key {
      border: 0;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .white {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-width: 0;
      padding: 0 6px 20px;
      border-right: 1px solid var(--white-key-edge);
      border-bottom: 8px solid #c9c0b0;
      border-radius: 0 0 7px 7px;
      background: linear-gradient(180deg, #fbfffe 0%, var(--white-key) 64%, #e9e1d3 100%);
      color: var(--ink);
      font-weight: 800;
      font-size: 1.05rem;
      box-shadow: inset 0 -10px 14px rgba(92, 73, 46, 0.11);
    }

    .white:first-child {
      border-radius: 8px 0 7px 7px;
    }

    .white:last-child {
      border-right: 0;
      border-radius: 0 8px 7px 7px;
    }

    .white.active,
    .white:active {
      transform: translateY(3px);
      border-bottom-width: 5px;
      background: linear-gradient(180deg, #ecf6f6 0%, #e5ddcf 100%);
    }

    .black-keys {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .black {
      position: absolute;
      top: 0;
      width: 8.5%;
      height: 61%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 4px 16px;
      border-bottom: 9px solid var(--black-key-edge);
      border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, #070809 0%, var(--black-key) 28%, #303741 52%, #111418 100%);
      color: #e9f5f4;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.34);
      pointer-events: auto;
      z-index: 2;
    }

    .black.active,
    .black:active {
      transform: translateY(3px);
      height: calc(61% + 1px);
      border-bottom-width: 6px;
      background: linear-gradient(90deg, #030404 0%, #11151a 40%, #222a32 65%, #070809 100%);
    }

    .black[data-note="C#4"] {
      left: 8.35%;
    }

    .black[data-note="D#4"] {
      left: 20.85%;
    }

    .black[data-note="F#4"] {
      left: 45.85%;
    }

    .black[data-note="G#4"] {
      left: 58.35%;
    }

    .black[data-note="A#4"] {
      left: 70.85%;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    input[type="range"] {
      accent-color: var(--accent);
      width: 150px;
    }

    @media (max-width: 700px) {
      body {
        place-items: start center;
      }

      main {
        width: 100%;
        min-height: 100vh;
        padding: 24px 16px;
        border: 0;
        border-radius: 0;
      }

      header,
      .controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .piano {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>One Octave Piano</h1>
        <p>Click or tap any key from C4 through C5 to play its pitch. You can also use your keyboard row: A W S E D F T G Y H U J K.</p>
      </div>
      <div class="display" aria-live="polite">
        <span>Now playing</span>
        <strong id="current-note">--</strong>
      </div>
    </header>

    <section class="piano-wrap" aria-label="One octave piano from C4 to C5">
      <div class="piano">
        <div class="white-keys">
          <button class="key white" type="button" data-note="C4" data-key="a">C4</button>
          <button class="key white" type="button" data-note="D4" data-key="s">D4</button>
          <button class="key white" type="button" data-note="E4" data-key="d">E4</button>
          <button class="key white" type="button" data-note="F4" data-key="f">F4</button>
          <button class="key white" type="button" data-note="G4" data-key="g">G4</button>
          <button class="key white" type="button" data-note="A4" data-key="h">A4</button>
          <button class="key white" type="button" data-note="B4" data-key="j">B4</button>
          <button class="key white" type="button" data-note="C5" data-key="k">C5</button>
        </div>
        <div class="black-keys" aria-hidden="false">
          <button class="key black" type="button" data-note="C#4" data-key="w">C#</button>
          <button class="key black" type="button" data-note="D#4" data-key="e">D#</button>
          <button class="key black" type="button" data-note="F#4" data-key="t">F#</button>
          <button class="key black" type="button" data-note="G#4" data-key="y">G#</button>
          <button class="key black" type="button" data-note="A#4" data-key="u">A#</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <div>Pure Web Audio tone with a short piano-like envelope.</div>
      <label class="volume" for="volume">
        Volume
        <input id="volume" type="range" min="0" max="1" value="0.65" step="0.01">
      </label>
    </div>
  </main>

  <script>
    const notes = {
      "C4": 261.63,
      "C#4": 277.18,
      "D4": 293.66,
      "D#4": 311.13,
      "E4": 329.63,
      "F4": 349.23,
      "F#4": 369.99,
      "G4": 392.00,
      "G#4": 415.30,
      "A4": 440.00,
      "A#4": 466.16,
      "B4": 493.88,
      "C5": 523.25
    };

    const currentNote = document.querySelector("#current-note");
    const volume = document.querySelector("#volume");
    const keys = [...document.querySelectorAll(".key")];
    const keyMap = new Map(keys.map((key) => [key.dataset.key, key]));
    let audioContext;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    function playNote(note, element) {
      const context = getAudioContext();
      const now = context.currentTime;
      const masterGain = context.createGain();
      const primary = context.createOscillator();
      const overtone = context.createOscillator();
      const overtoneGain = context.createGain();
      const selectedVolume = Number(volume.value);

      primary.type = "triangle";
      primary.frequency.setValueAtTime(notes[note], now);
      overtone.type = "sine";
      overtone.frequency.setValueAtTime(notes[note] * 2, now);

      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.exponentialRampToValueAtTime(Math.max(selectedVolume, 0.001), now + 0.012);
      masterGain.gain.exponentialRampToValueAtTime(Math.max(selectedVolume * 0.32, 0.001), now + 0.15);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);

      overtoneGain.gain.setValueAtTime(selectedVolume * 0.22, now);
      overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

      primary.connect(masterGain);
      overtone.connect(overtoneGain);
      overtoneGain.connect(masterGain);
      masterGain.connect(context.destination);

      primary.start(now);
      overtone.start(now);
      primary.stop(now + 1);
      overtone.stop(now + 1);

      element.classList.add("active");
      currentNote.textContent = note;
      window.setTimeout(() => element.classList.remove("active"), 150);
    }

    keys.forEach((key) => {
      key.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        playNote(key.dataset.note, key);
      });
    });

    window.addEventListener("keydown", (event) => {
      const key = keyMap.get(event.key.toLowerCase());
      if (!key || event.repeat) return;
      playNote(key.dataset.note, key);
    });
  </script>
</body>
</html>
